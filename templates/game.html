<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>石头剪刀布 - 玩家对战大屏</title>
    <style>
        :root {
            --bg: #0f172a;
            --card-bg: #1e293b;
            --accent: #38bdf8;
            --border: #334155;
        }
        * { box-sizing: border-box; }
        body { margin: 0; background: var(--bg); color: #f8fafc; font-family: "PingFang SC", "Microsoft YaHei", sans-serif; }
        .header { background: var(--card-bg); padding: 16px 24px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); }
        
        /* PC 端大屏双栏容器 */
        .container { max-width: 1450px; margin: 0 auto; padding: 20px; }
        .game-layout { display: grid; grid-template-columns: 460px 1fr; gap: 20px; align-items: start; }
        
        .card { background: var(--card-bg); border-radius: 16px; padding: 22px; border: 1px solid var(--border); box-shadow: 0 4px 15px rgba(0,0,0,0.25); }
        
        .player-bar { display: flex; justify-content: space-between; align-items: center; font-size: 16px; margin-bottom: 15px; }
        .status-badge { text-align: center; padding: 14px; border-radius: 12px; font-weight: bold; margin-bottom: 18px; font-size: 16px; }
        .status-badge.playing { background: rgba(56, 189, 248, 0.15); color: #38bdf8; border: 1px solid #0284c7; }
        .status-badge.waiting { background: #334155; color: #94a3b8; }
        .status-badge.win { background: rgba(16, 185, 129, 0.15); color: #34d399; border: 1px solid #059669; }
        .status-badge.lose { background: rgba(239, 68, 68, 0.15); color: #f87171; border: 1px solid #dc2626; }

        .opponent-area { text-align: center; margin: 10px 0 20px; }
        .opp-name { font-size: 32px; font-weight: bold; color: #f43f5e; margin-top: 6px; }

        /* 放大出拳手势卡片 */
        .choices-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; margin: 15px 0; }
        .choice-btn {
            background: #0b1120;
            border: 2px solid #334155;
            border-radius: 16px;
            padding: 26px 10px;
            color: white;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 12px;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        .choice-icon { font-size: 58px; }
        .choice-name { font-size: 18px; font-weight: bold; }
        .choice-btn:hover:not(:disabled) {
            transform: translateY(-5px) scale(1.03);
            border-color: var(--accent);
            background: #132337;
            box-shadow: 0 10px 20px rgba(56, 189, 248, 0.25);
        }
        .choice-btn:active:not(:disabled) { transform: scale(0.96); }
        .choice-btn:disabled { opacity: 0.35; cursor: not-allowed; transform: none; border-color: #334155; }

        /* 右侧树状图与缩放工具栏 */
        .bracket-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
        .zoom-controls { display: flex; align-items: center; gap: 6px; background: #0b1120; padding: 4px 8px; border-radius: 8px; border: 1px solid #334155; }
        .btn-zoom { background: #1e293b; color: #f8fafc; padding: 6px 10px; font-size: 12px; border-radius: 6px; border: 1px solid #475569; cursor: pointer; font-weight: bold; }
        .btn-zoom:hover { background: #334155; }
        .zoom-level { font-size: 12px; color: #38bdf8; font-weight: bold; min-width: 40px; text-align: center; }

        .bracket-scroll { overflow: auto; padding: 20px; background: #070d19; border-radius: 12px; min-height: 480px; max-height: 750px; }
        .bracket-tree { display: flex; gap: 35px; min-width: max-content; align-items: center; transform-origin: top left; transition: transform 0.2s ease; }
        .bracket-col { display: flex; flex-direction: column; gap: 18px; min-width: 170px; }
        .bracket-col-title { text-align: center; font-size: 13px; color: #94a3b8; border-bottom: 1px solid #334155; padding-bottom: 6px; margin-bottom: 4px; }
        .match-card-sm { background: #1e293b; border: 1px solid #334155; border-radius: 8px; font-size: 13px; overflow: hidden; }
        .match-row-sm { padding: 8px 12px; display: flex; justify-content: space-between; }
        .match-row-sm.win { background: rgba(16, 185, 129, 0.2); color: #34d399; font-weight: bold; }
        .match-row-sm.lose { color: #64748b; text-decoration: line-through; }
        .bye-card-sm { background: rgba(245, 158, 11, 0.1); border: 1px dashed #d97706; padding: 10px 12px; border-radius: 8px; font-size: 13px; color: #fbbf24; }
        .champ-card-sm { background: #78350f; border: 2px solid #fbbf24; border-radius: 10px; padding: 18px; text-align: center; color: #fef08a; font-weight: bold; font-size: 16px; }

        /* 移动端向下单栏自适应 */
        @media (max-width: 950px) {
            .game-layout { grid-template-columns: 1fr; }
            .bracket-scroll { min-height: 320px; }
        }
    </style>
</head>
<body>

<header class="header">
    <div style="font-size:18px; font-weight:bold;">✊ ✌️ 🖐️ 石头剪刀布 - 玩家对战大屏</div>
    <div id="roundText" style="color:#94a3b8; font-size:15px; font-weight:bold;">第 0 轮</div>
</header>

<main class="container">
    <div class="game-layout">
        <!-- 左侧：个人对战状态与出拳控制卡片 -->
        <div class="card">
            <div class="player-bar">
                <div>当前选手: <strong id="playerName" style="color:var(--accent); font-size:20px;">-</strong></div>
            </div>

            <div id="statusBadge" class="status-badge waiting">正在同步对战赛况...</div>

            <!-- 出拳交互区 -->
            <div id="playArea" style="display:none;">
                <div class="opponent-area">
                    <div style="font-size:13px; color:#94a3b8;">本轮对决对手</div>
                    <div id="oppName" class="opp-name">-</div>
                </div>
                <div class="choices-grid">
                    <button class="choice-btn" onclick="play('rock')">
                        <span class="choice-icon">✊</span>
                        <span class="choice-name">石头</span>
                    </button>
                    <button class="choice-btn" onclick="play('scissors')">
                        <span class="choice-icon">✌️</span>
                        <span class="choice-name">剪刀</span>
                    </button>
                    <button class="choice-btn" onclick="play('paper')">
                        <span class="choice-icon">🖐️</span>
                        <span class="choice-name">布</span>
                    </button>
                </div>
            </div>

            <!-- 轮空展示 -->
            <div id="byeArea" style="display:none; text-align:center; padding:30px 10px;">
                <div style="font-size:55px;">🎫</div>
                <h2 style="color:#fbbf24; margin:12px 0;">本轮单数轮空！</h2>
                <p style="color:#94a3b8; font-size:15px;">恭喜你本轮免战，自动进入下一轮！</p>
            </div>

            <!-- 冠军展示 -->
            <div id="champArea" style="display:none; text-align:center; padding:35px 10px;">
                <div style="font-size:65px;">🏆</div>
                <h1 style="color:#fef08a; margin:12px 0;">恭喜你荣获全场总冠军！</h1>
            </div>
        </div>

        <!-- 右侧：全场树状淘汰大图看板（支持缩放） -->
        <div class="card">
            <div class="bracket-header">
                <h3 style="margin:0; color:var(--accent);">🌳 全场比赛树形进度看板</h3>
                <div class="zoom-controls">
                    <button class="btn-zoom" onclick="zoomStudentTree(0.1)">🔍+ 放大</button>
                    <button class="btn-zoom" onclick="zoomStudentTree(-0.1)">🔍- 缩小</button>
                    <button class="btn-zoom" onclick="resetStudentZoom()">↺ 重置</button>
                    <span id="studentZoomLevel" class="zoom-level">100%</span>
                </div>
            </div>
            <div class="bracket-scroll">
                <div id="bracketTree" class="bracket-tree"></div>
            </div>
        </div>
    </div>
</main>

<script>
    const playerId = localStorage.getItem("rps_player_id");
    const savedName = localStorage.getItem("rps_player_name");
    if (savedName) document.getElementById("playerName").innerText = savedName;
    if (!playerId) window.location.href = "/";

    let studentScale = 1.0;

    function zoomStudentTree(delta) {
        studentScale = Math.min(Math.max(studentScale + delta, 0.5), 2.0);
        applyStudentZoom();
    }

    function resetStudentZoom() {
        studentScale = 1.0;
        applyStudentZoom();
    }

    function applyStudentZoom() {
        const tree = document.getElementById("bracketTree");
        tree.style.transform = `scale(${studentScale})`;
        document.getElementById("studentZoomLevel").innerText = `${Math.round(studentScale * 100)}%`;
    }

    async function loadStatus() {
        try {
            const res = await fetch(`/api/player/${encodeURIComponent(playerId)}`);
            const data = await res.json();
            if (!data.success) return;

            const p = data.player;
            document.getElementById("roundText").innerText = data.round > 0 ? `第 ${data.round} 轮` : "未开赛";
            
            const badge = document.getElementById("statusBadge");
            const playArea = document.getElementById("playArea");
            const byeArea = document.getElementById("byeArea");
            const champArea = document.getElementById("champArea");

            playArea.style.display = "none";
            byeArea.style.display = "none";
            champArea.style.display = "none";

            if (p.status === "champion") {
                champArea.style.display = "block";
                badge.className = "status-badge win";
                badge.innerText = "🏆 恭喜获得全场总冠军！";
            } else if (p.status === "bye") {
                byeArea.style.display = "block";
                badge.className = "status-badge win";
                badge.innerText = "本轮轮空，直接晋级";
            } else if (p.status === "playing") {
                playArea.style.display = "block";
                document.getElementById("oppName").innerText = p.opponent || "-";
                if (p.choice) {
                    badge.className = "status-badge waiting";
                    badge.innerText = "已出拳，正在等待对方出拳...";
                    setButtons(false);
                } else {
                    badge.className = "status-badge playing";
                    badge.innerText = "请点击下方手势出拳！";
                    setButtons(true);
                }
            } else if (p.status === "winner") {
                badge.className = "status-badge win";
                badge.innerText = "本轮胜利！等待下一轮配对...";
            } else if (p.status === "eliminated") {
                badge.className = "status-badge lose";
                badge.innerText = "很遗憾您已被淘汰（可在右侧观战赛况）";
            } else {
                badge.className = "status-badge waiting";
                badge.innerText = "等待老师开启对决...";
            }

            renderTree(data.bracket);
        } catch(e) {
            console.error(e);
        }
    }

    function renderTree(bracket) {
        const treeBox = document.getElementById("bracketTree");
        if (!bracket || !bracket.rounds || bracket.rounds.length === 0) {
            treeBox.innerHTML = `<div style="color:#64748b; font-size:13px; padding:20px;">暂无对阵数据（等待开赛）</div>`;
            return;
        }

        let html = "";
        bracket.rounds.forEach(r => {
            html += `<div class="bracket-col">`;
            html += `<div class="bracket-col-title">第 ${r.round} 轮</div>`;

            r.byes.forEach(name => {
                html += `<div class="bye-card-sm"><span>🎫 <strong>${name}</strong></span><span>(轮空)</span></div>`;
            });

            r.matches.forEach(m => {
                const isFin = m.status === 'finished';
                const p1Win = isFin && m.winner === m.player1;
                const p2Win = isFin && m.winner === m.player2;
                html += `
                    <div class="match-card-sm">
                        <div class="match-row-sm ${p1Win ? 'win' : (isFin ? 'lose' : '')}"><span>${m.player1}</span><span>${p1Win ? '胜' : ''}</span></div>
                        <div class="match-row-sm ${p2Win ? 'win' : (isFin ? 'lose' : '')}"><span>${m.player2}</span><span>${p2Win ? '胜' : ''}</span></div>
                    </div>
                `;
            });
            html += `</div>`;
        });

        if (bracket.champion) {
            html += `<div class="champ-card-sm">🏆 冠军: ${bracket.champion}</div>`;
        }
        treeBox.innerHTML = html;
        applyStudentZoom();
    }

    function setButtons(enable) {
        document.querySelectorAll(".choice-btn").forEach(b => b.disabled = !enable);
    }

    async function play(choice) {
        setButtons(false);
        try {
            const res = await fetch("/api/play", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ player_id: playerId, choice: choice })
            });
            const data = await res.json();
            if (!data.success) {
                alert(data.message);
                setButtons(true);
            }
            loadStatus();
        } catch(e) {
            setButtons(true);
        }
    }

    loadStatus();
    setInterval(loadStatus, 1200);
</script>
</body>
</html>
