<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>教师控制台 - 石头剪刀布淘汰赛</title>
    <style>
        :root {
            --primary: #4f46e5;
            --bg-dark: #0f172a;
            --card-bg: #1e293b;
            --border-color: #334155;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }
        * { box-sizing: border-box; }
        body { margin: 0; background: var(--bg-dark); color: var(--text-main); font-family: "PingFang SC", "Microsoft YaHei", -apple-system, sans-serif; }
        
        .header { background: var(--card-bg); padding: 18px 25px; border-bottom: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 15px; }
        .header-title { font-size: 22px; font-weight: bold; display: flex; align-items: center; gap: 10px; }
        
        .url-banner { display: flex; align-items: center; gap: 10px; background: #0b1120; border: 1px solid #3b82f6; padding: 8px 16px; border-radius: 30px; }
        .url-text { font-family: monospace; font-size: 15px; color: #60a5fa; font-weight: bold; }
        .btn-copy { background: linear-gradient(135deg, #3b82f6, #2563eb); color: white; border: none; padding: 6px 16px; border-radius: 20px; font-size: 13px; font-weight: bold; cursor: pointer; transition: 0.2s; }
        .btn-copy:hover { transform: scale(1.05); filter: brightness(1.1); }

        .container { max-width: 1400px; margin: 0 auto; padding: 25px 20px; }
        .panel { background: var(--card-bg); border-radius: 16px; padding: 22px; margin-bottom: 20px; border: 1px solid var(--border-color); box-shadow: 0 10px 25px -5px rgba(0,0,0,0.3); }
        
        .control-btns { display: flex; gap: 12px; flex-wrap: wrap; }
        button { border: none; border-radius: 10px; padding: 12px 24px; font-size: 15px; font-weight: bold; cursor: pointer; transition: 0.2s; }
        .btn-start { background: linear-gradient(135deg, #6366f1, #4f46e5); color: white; }
        .btn-begin { background: linear-gradient(135deg, #10b981, #059669); color: white; }
        .btn-stop { background: linear-gradient(135deg, #ef4444, #dc2626); color: white; }
        .btn-refresh { background: #334155; color: #cbd5e1; }
        button:hover { transform: translateY(-2px); opacity: 0.95; }

        .status-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px; margin-bottom: 25px; }
        .status-card { background: #0b1120; border-radius: 12px; padding: 18px; text-align: center; border: 1px solid var(--border-color); }
        .status-label { color: var(--text-muted); font-size: 13px; margin-bottom: 6px; }
        .status-value { font-size: 26px; font-weight: bold; color: #38bdf8; }

        /* 🌲 树形图缩放控制栏 */
        .bracket-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; flex-wrap: wrap; gap: 10px; }
        .zoom-controls { display: flex; align-items: center; gap: 8px; background: #0b1120; padding: 4px 8px; border-radius: 8px; border: 1px solid #334155; }
        .btn-zoom { background: #1e293b; color: #f8fafc; padding: 6px 12px; font-size: 13px; border-radius: 6px; border: 1px solid #475569; }
        .btn-zoom:hover { background: #334155; }
        .zoom-level { font-size: 13px; color: #38bdf8; font-weight: bold; min-width: 45px; text-align: center; }

        .bracket-wrapper { overflow: auto; padding: 25px; background: #070d19; border-radius: 12px; border: 1px solid #1e293b; min-height: 280px; max-height: 650px; }
        .bracket-tree { display: flex; align-items: center; gap: 50px; min-width: max-content; transform-origin: top left; transition: transform 0.2s ease; }
        .bracket-col { display: flex; flex-direction: column; gap: 24px; min-width: 220px; }
        .bracket-col-title { text-align: center; font-size: 14px; font-weight: bold; color: var(--text-muted); padding-bottom: 8px; border-bottom: 2px solid #334155; margin-bottom: 6px; }
        .match-card { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 10px; overflow: hidden; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.4); }
        .player-row { padding: 9px 14px; font-size: 14px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border-color); }
        .player-row:last-child { border-bottom: none; }
        .player-row.win { background: rgba(16, 185, 129, 0.15); color: #34d399; font-weight: bold; }
        .player-row.lose { color: #64748b; text-decoration: line-through; }
        
        .bye-card { background: rgba(245, 158, 11, 0.1); border: 1px dashed #d97706; border-radius: 10px; padding: 12px 14px; color: #fbbf24; font-size: 13px; display: flex; justify-content: space-between; align-items: center; }
        .champion-card { background: linear-gradient(135deg, #78350f, #451a03); border: 2px solid #fbbf24; border-radius: 14px; padding: 25px 30px; text-align: center; color: #fef08a; font-size: 20px; font-weight: bold; box-shadow: 0 0 30px rgba(251, 191, 36, 0.25); }

        .player-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 12px; }
        .player-item { background: #0b1120; border-radius: 10px; padding: 12px; border-left: 4px solid #64748b; }
        .player-item.playing { border-left-color: #38bdf8; }
        .player-item.winner { border-left-color: #10b981; }
        .player-item.bye { border-left-color: #f59e0b; background: #1f1b0a; }
        .player-item.eliminated { border-left-color: #ef4444; opacity: 0.5; }
        .player-item.champion { border-left-color: #eab308; background: #2b2308; }
    </style>
</head>
<body>

<header class="header">
    <div class="header-title">
        <span>🎮 石头剪刀布淘汰赛</span>
        <span style="font-size:13px; background:#334155; padding:3px 10px; border-radius:20px; color:#cbd5e1;">教师控制大屏</span>
    </div>
    
    <div class="url-banner">
        <span style="color:#94a3b8; font-size:13px;">📢 学生访问地址:</span>
        <span id="studentUrl" class="url-text">{{ student_url }}</span>
        <button class="btn-copy" onclick="copyStudentUrl()">📋 复制链接发给学生</button>
    </div>
</header>

<main class="container">
    <div class="panel">
        <div class="control-btns">
            <button class="btn-start" onclick="startGame()">1. 开启新房间 (重置)</button>
            <button class="btn-begin" onclick="beginMatch()">2. 🎯 开始淘汰赛 (锁定名单)</button>
            <button class="btn-stop" onclick="stopGame()">■ 强制结束</button>
            <button class="btn-refresh" onclick="loadStatus()">↻ 刷新状态</button>
        </div>
    </div>

    <div class="status-grid">
        <div class="status-card"><div class="status-label">房间状态</div><div id="gameStatus" class="status-value">-</div></div>
        <div class="status-card"><div class="status-label">报名人数</div><div id="playerCount" class="status-value">0</div></div>
        <div class="status-card"><div class="status-label">当前轮次</div><div id="round" class="status-value">未开赛</div></div>
        <div class="status-card"><div class="status-label">全场总冠军</div><div id="champName" class="status-value" style="color:#fbbf24;">-</div></div>
    </div>

    <!-- 树形淘汰图（支持缩放） -->
    <div class="panel">
        <div class="bracket-header">
            <h3 style="margin:0; color:#38bdf8;">🌳 比赛晋级树形对阵图</h3>
            <div class="zoom-controls">
                <button class="btn-zoom" onclick="zoomTree(0.1)">🔍+ 放大</button>
                <button class="btn-zoom" onclick="zoomTree(-0.1)">🔍- 缩小</button>
                <button class="btn-zoom" onclick="resetZoom()">↺ 重置</button>
                <span id="zoomLevel" class="zoom-level">100%</span>
            </div>
        </div>
        <div class="bracket-wrapper">
            <div id="bracketTree" class="bracket-tree"></div>
        </div>
    </div>

    <div class="panel">
        <h3 style="margin-top:0;">👥 全体选手实时状态 (<span id="totalPlayerCount">0</span>)</h3>
        <div id="playerList" class="player-grid"></div>
    </div>
</main>

<script>
    let currentScale = 1.0;

    function zoomTree(delta) {
        currentScale = Math.min(Math.max(currentScale + delta, 0.5), 2.0);
        applyZoom();
    }

    function resetZoom() {
        currentScale = 1.0;
        applyZoom();
    }

    function applyZoom() {
        const tree = document.getElementById("bracketTree");
        tree.style.transform = `scale(${currentScale})`;
        document.getElementById("zoomLevel").innerText = `${Math.round(currentScale * 100)}%`;
    }

    function copyStudentUrl() {
        const url = document.getElementById("studentUrl").innerText.trim();
        navigator.clipboard.writeText(url).then(() => {
            alert("✅ 学生端链接已成功复制到剪贴板！\n" + url);
        }).catch(() => {
            alert("复制失败，请手动复制：" + url);
        });
    }

    async function loadStatus() {
        try {
            const res = await fetch("/api/teacher/status");
            const data = await res.json();

            document.getElementById("gameStatus").innerText = data.finished ? "已结束" : (data.started ? (data.round > 0 ? "比赛进行中" : "等待学生加入") : "未开房");
            document.getElementById("playerCount").innerText = data.player_count;
            document.getElementById("totalPlayerCount").innerText = data.player_count;
            document.getElementById("round").innerText = data.round > 0 ? `第 ${data.round} 轮` : "未开赛";
            document.getElementById("champName").innerText = data.champion || "-";

            renderBracket(data.bracket);
            renderPlayers(data.players);
        } catch(e) {
            console.error(e);
        }
    }

    function renderBracket(bracket) {
        const treeBox = document.getElementById("bracketTree");
        if (!bracket || !bracket.rounds || bracket.rounds.length === 0 || bracket.max_round === 0) {
            treeBox.innerHTML = `<div style="color:#64748b; padding:20px;">等待开赛后自动生成树状对阵图...</div>`;
            return;
        }

        let html = "";
        bracket.rounds.forEach(r => {
            html += `<div class="bracket-col">`;
            html += `<div class="bracket-col-title">第 ${r.round} 轮</div>`;

            r.byes.forEach(name => {
                html += `
                    <div class="bye-card">
                        <span>🎫 <strong>${name}</strong></span>
                        <span style="font-size:11px; background:#d97706; color:#fff; padding:2px 6px; border-radius:4px;">轮空保送</span>
                    </div>
                `;
            });

            r.matches.forEach(m => {
                const isFin = m.status === 'finished';
                const p1Win = isFin && m.winner === m.player1;
                const p2Win = isFin && m.winner === m.player2;

                html += `
                    <div class="match-card">
                        <div class="player-row ${p1Win ? 'win' : (isFin ? 'lose' : '')}">
                            <span>${m.player1}</span>
                            <span>${p1Win ? '👑 晋级' : ''}</span>
                        </div>
                        <div class="player-row ${p2Win ? 'win' : (isFin ? 'lose' : '')}">
                            <span>${m.player2}</span>
                            <span>${p2Win ? '👑 晋级' : ''}</span>
                        </div>
                    </div>
                `;
            });
            html += `</div>`;
        });

        if (bracket.champion) {
            html += `
                <div class="champion-card">
                    <div>🏆 总冠军诞生</div>
                    <div style="margin-top:10px; font-size:24px; color:#fff;">${bracket.champion}</div>
                </div>
            `;
        }
        treeBox.innerHTML = html;
        applyZoom();
    }

    function renderPlayers(players) {
        const pList = document.getElementById("playerList");
        if (!players || players.length === 0) {
            pList.innerHTML = `<div style="color:#64748b;">暂无选手报名</div>`;
            return;
        }
        pList.innerHTML = players.map(p => {
            let label = { "waiting": "等待中", "playing": "对局中", "winner": "晋级", "bye": "本轮轮空", "eliminated": "淘汰", "champion": "🏆 冠军" }[p.status] || p.status;
            return `
                <div class="player-item ${p.status}">
                    <div style="font-weight:bold; font-size:15px;">${p.name}</div>
                    <div style="font-size:12px; color:#94a3b8; margin-top:4px;">${label}</div>
                </div>
            `;
        }).join('');
    }

    async function startGame() {
        const res = await fetch("/api/teacher/start", { method: "POST" });
        const d = await res.json();
        alert(d.message);
        loadStatus();
    }
    async function beginMatch() {
        const res = await fetch("/api/teacher/begin_match", { method: "POST" });
        const d = await res.json();
        alert(d.message);
        loadStatus();
    }
    async function stopGame() {
        if (!confirm("确定结束本次比赛吗？")) return;
        const res = await fetch("/api/teacher/stop", { method: "POST" });
        const d = await res.json();
        alert(d.message);
        loadStatus();
    }

    loadStatus();
    setInterval(loadStatus, 1500);
</script>
</body>
</html>
